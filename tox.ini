[tox]
envlist = py3
skipsdist = true

[testenv]
deps=
    -rrequirements/dev.txt

[testenv:py3]
allowlist_externals =
   ./manage.py
setenv =
    DJANGO_SETTINGS_MODULE=toolkit.test_settings
commands =
    black --line-length 79 --check {toxinidir}/toolkit
    ./manage.py test --settings=toolkit.test_settings

# Build the docker image and run the test suite inside it: Run with "tox -e docker"
[testenv:docker]
deps =
allowlist_externals =
   ./runtests_docker.sh
commands =
    ./runtests_docker.sh {posargs}
